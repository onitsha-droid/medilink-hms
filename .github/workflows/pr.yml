name: PR Checks

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # ── Backend: ESLint + Jest ───────────────────────────────────────────────────
  backend:
    name: Backend — ESLint & Jest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      mongo:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      PORT: 3000
      NODE_ENV: test
      MONGODB_URI: mongodb://localhost:27017/medilink_ci
      JWT_SECRET: ci-test-secret-replace-in-production
      JWT_EXPIRES_IN: 1d

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --coverage --coverageReporters=text-summary

  # ── Frontend: flutter analyze + flutter test ─────────────────────────────────
  frontend:
    name: Frontend — flutter analyze & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.19.x"
          channel: "stable"
          cache: true

      - name: Install dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Generate code (Riverpod / JSON serialization)
        working-directory: frontend
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        working-directory: frontend
        run: flutter analyze --fatal-infos

      - name: Test
        working-directory: frontend
        run: flutter test --coverage
